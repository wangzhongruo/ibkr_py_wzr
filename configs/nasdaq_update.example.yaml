data_center:
  # Hostname/IP of your TWS or IB Gateway session
  host: 127.0.0.1
  # Port number (TWS paper trading = 7497, live trading = 7496 by default)
  port: 7497
  # Client ID used when connecting via ib_insync (must be unique per session)
  client_id: 7
  # Whether to limit downloads to Regular Trading Hours
  use_rth: true
  # IANA timezone name used to localise timestamps
  timezone: America/New_York
  # Default exchange routing. ARCA is used by default but can be overridden here
  # if you need to request data from another venue.
  exchange: ARCA
  primary_exchange: ARCA
  # Directory where per-symbol parquet files will be stored. Existing files in
  # this directory are inspected to decide whether an incremental or full
  # refresh is required.
  data_directory: data/nasdaq
  # Primary NASDAQ listings endpoint. Leave as null to rely solely on fallbacks.
  nasdaq_listing_url: https://ftp.nasdaqtrader.com/dynamic/symdir/nasdaqtraded.txt
  # Additional NASDAQ listings sources that will be attempted if the primary
  # URL is unavailable. The default HTTPS host works in environments that block
  # ftp.nasdaqtrader.com.
  nasdaq_listing_fallback_urls:
    - https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqtraded.txt
  # HTTP timeout (seconds) and retry behaviour for downloading the official
  # NASDAQ listings file. Increase these values if your environment frequently
  # times out when contacting ftp.nasdaqtrader.com.
  nasdaq_listing_timeout: 45
  nasdaq_listing_retries: 5
  nasdaq_listing_retry_backoff: 10
update:
  # Historical bar size requested from IBKR (e.g. "1 min", "1 hour", "1 day")
  bar_size: "1 min"
  # Data type requested (TRADES, MIDPOINT, BID, ASK, etc.)
  what_to_show: TRADES
  # Initial backfill start date for first-time syncs (ISO 8601 format)
  start_date: 2011-01-01
  # Optional end timestamp (ISO 8601). Omit to download up to "now".
  # end_datetime: 2024-01-31T16:00:00
  # Number of background workers (each uses an incremented client_id)
  max_workers: 1
  # Delay between historical requests to avoid pacing violations
  throttle_seconds: 0.25
  # Toggle tqdm-based progress bars (requires the tqdm package)
  progress: true
